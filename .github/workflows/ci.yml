name: CI

on: [push, pull_request]

jobs:
  functionality:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - Gemfile
          - gemfiles/activesupport_7.0.gemfile
          - gemfiles/activesupport_7.1.gemfile
          - gemfiles/activesupport_7.2.gemfile
          - gemfiles/activesupport_8.0.gemfile
          - gemfiles/activesupport_edge.gemfile
        ruby: ["3.3", "3.4", "4.0"]
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Tests
      run: bundle exec rake test

    - name: Specs
      run: bundle exec rspec
  style:
    runs-on: ubuntu-latest
    name: Rubocop
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      with:
        bundler-cache: true

    - name: RuboCop
      run: bundle exec rubocop
